version: '3.8'

services:
    postgres:
        image: postgres:16-alpine
        container_name: eco-drone-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-eco-drone-db}
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - eco-drone-network

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: eco-drone-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PORT: ${PORT:-3000}
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eco-drone-db}?schema=public
            JWT_KEY: ${JWT_KEY}
            REFRESH_JWT_KEY: ${REFRESH_JWT_KEY}
            NODE_ENV: production
        ports:
            - '3000:3000'
        networks:
            - eco-drone-network
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://localhost:3000/api-docs', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

volumes:
    postgres_data:
        driver: local

networks:
    eco-drone-network:
        driver: bridge
